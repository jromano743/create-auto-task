[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "create-auto-task"
version = "0.8.2"
description = "Cross-platform desktop automation recorder and runner"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Create Auto Task contributors"}]
dependencies = [
    "pydantic>=2.10,<3",
    "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
execution = [
    "pyautogui>=0.9.54,<1",
    "pynput>=1.7.7,<2",
]
gui = [
    "PySide6>=6.8,<7",
]
all = [
    "pyautogui>=0.9.54,<1",
    "pynput>=1.7.7,<2",
    "PySide6>=6.8,<7",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "pyinstaller>=6.11,<7",
]

[project.scripts]
create-auto-task = "create_auto_task.interfaces.cli.cli:main"
create-auto-task-gui = "create_auto_task.interfaces.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
